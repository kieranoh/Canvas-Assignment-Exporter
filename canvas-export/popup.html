<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Canvas Exporter</title>
    <style>
      body {
        min-width: 260px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        margin: 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
      }
      .progress-container {
        width: 100%;
        height: 10px;
        background: #eee;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 4px;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: #4caf50;
        transition: width 0.1s linear;
      }
      #status {
        margin-top: 6px;
        white-space: pre-line;
      }
      #eta {
        margin-top: 2px;
        font-size: 12px;
        color: #555;
      }
      label {
        font-size: 13px;
      }
      input,
      select {
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <!-- 사용자 정보 입력 -->
    <div style="margin-bottom: 12px;">
      <label>나이 (20~30):
        <br />
        <input
          id="age"
          type="number"
          min="20"
          max="30"
          style="width: 100%;"
          required
        />
      </label>
    </div>

    <div style="margin-bottom: 12px;">
      <label>성별:
        <br />
        <select id="gender" style="width: 100%;">
          <option value="">선택하세요</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </label>
    </div>

    <div style="margin-bottom: 12px;">
      <label>장애 여부:
        <br />
        <select id="disabled" style="width: 100%;">
          <option value="">선택하세요</option>
          <option value="예">예</option>
          <option value="아니요">아니요</option>
        </select>
      </label>
    </div>

    <!-- 실행 버튼 -->
    <button id="export">Export Assignments + Submissions</button>

    <!-- 상태 / 진행바 / ETA -->
    <div id="status">대기 중...</div>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="eta"></div>

    <script src="popup.js"></script>
  </body>
</html>
