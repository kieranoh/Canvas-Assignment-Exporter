<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Canvas Exporter</title>
    <style>
      body {
        min-width: 260px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        margin: 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
      }
      .progress-container {
        width: 100%;
        height: 10px;
        background: #eee;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 4px;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: #4caf50;
        transition: width 0.1s linear;
      }
      #status {
        margin-top: 6px;
        white-space: pre-line;
      }
      #eta {
        margin-top: 2px;
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <button id="export">Export Assignments + Submissions</button>

    <div id="status">대기 중...</div>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="eta"></div>

    <script src="popup.js"></script>
  </body>
</html>
